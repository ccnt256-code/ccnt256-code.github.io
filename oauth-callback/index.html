<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>인증 코드</title>
<style>
body { font-family: sans-serif; text-align: center; padding: 40px 20px; background: #f5f5f5; }
.code-box { background: #fff; border: 3px solid #4CAF50; border-radius: 12px; padding: 30px; margin: 20px auto; max-width: 500px; }
.code { font-size: 14px; font-family: monospace; word-break: break-all; background: #e8f5e9; padding: 15px; border-radius: 8px; cursor: pointer; }
.copied { color: #4CAF50; font-weight: bold; margin-top: 10px; display: none; }
h1 { color: #333; }
.error { color: #f44336; }
</style>
</head>
<body>
<div class="code-box">
<h1>✅ 인증 완료!</h1>
<p>아래 코드를 복사해서 세종에게 보내주세요:</p>
<div class="code" id="code" onclick="copyCode()">로딩 중...</div>
<div class="copied" id="copied">📋 복사됨!</div>
<p style="color:#666;font-size:13px;margin-top:20px;">코드를 클릭하면 자동 복사됩니다</p>
</div>
<script>
const params = new URLSearchParams(window.location.search);
const code = params.get('code');
const el = document.getElementById('code');
if (code) {
    el.textContent = code;
} else {
    el.textContent = '코드를 찾을 수 없습니다';
    el.classList.add('error');
}
function copyCode() {
    if (code) {
        navigator.clipboard.writeText(code).then(() => {
            document.getElementById('copied').style.display = 'block';
        });
    }
}
</script>
</body>
</html>
